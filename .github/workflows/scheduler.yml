name: Agendador

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Processar tarefas do TrilhaGov
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
        run: |
          if [ -z "$RENDER_APP_URL" ] || [ -z "$SCHEDULER_TOKEN" ]; then
            echo "::notice::Agendador aguardando os segredos do ambiente gratuito."
            exit 0
          fi

          status="$(
            curl \
              --show-error \
              --silent \
              --output /tmp/scheduler-response.txt \
              --write-out "%{http_code}" \
              --retry 8 \
              --retry-delay 30 \
              --retry-all-errors \
              --max-time 420 \
              --request POST \
              --header "Authorization: Bearer $SCHEDULER_TOKEN" \
              "$RENDER_APP_URL/api/internal/scheduler" || true
          )"

          if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "Agendador processado com sucesso."
            exit 0
          fi

          if [ "$status" = "502" ] || [ "$status" = "503" ] || [ "$status" = "504" ] || [ "$status" = "000" ]; then
            echo "::notice::Render free indisponivel ou acordando agora. O proximo agendamento tentara novamente. HTTP $status."
            exit 0
          fi

          echo "::error::Agendador falhou com HTTP $status."
          cat /tmp/scheduler-response.txt || true
          exit 1
