name: Agendador

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Processar tarefas do TrilhaGov
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$RENDER_APP_URL" ] || [ -z "$SCHEDULER_TOKEN" ]; then
            echo "::notice::Agendador aguardando os segredos do ambiente gratuito."
            exit 0
          fi

          status="$(
            curl \
              --show-error \
              --silent \
              --output /tmp/scheduler-response.txt \
              --write-out "%{http_code}" \
              --retry 8 \
              --retry-delay 30 \
              --retry-all-errors \
              --max-time 420 \
              --request POST \
              --header "Authorization: Bearer $SCHEDULER_TOKEN" \
              "$RENDER_APP_URL/api/internal/scheduler" || true
          )"

          if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "Agendador processado com sucesso."
            exit 0
          fi

          # Um 502/503/504/000 isolado costuma ser o Render acordando do sono do
          # plano gratuito (ja toleramos isso com os retries acima). Mas se persistir
          # por execucoes seguidas (uma por hora), deixa de ser cold start e vira
          # indisponibilidade real — foi assim que a queda de 20/08 ficou sem alerta
          # por quase 1h. Por isso consultamos (somente leitura) se a execucao
          # agendada anterior tambem tolerou uma falha; se sim, falha alto agora.
          if [ "$status" = "502" ] || [ "$status" = "503" ] || [ "$status" = "504" ] || [ "$status" = "000" ]; then
            previous_run_id="$(gh run list --workflow scheduler.yml --json databaseId --limit 2 --jq '.[1].databaseId // empty' 2>/dev/null || true)"
            previous_tolerated="false"

            if [ -n "$previous_run_id" ] && gh run view "$previous_run_id" --log 2>/dev/null | grep -q "Render free indisponivel ou acordando agora"; then
              previous_tolerated="true"
            fi

            if [ "$previous_tolerated" = "true" ]; then
              echo "::error::Render indisponivel ha pelo menos 2 execucoes seguidas (HTTP $status agora). Ja passou do cold start esperado, provavel indisponibilidade real."
              exit 1
            fi

            echo "::notice::Render free indisponivel ou acordando agora. HTTP $status."
            exit 0
          fi

          echo "::error::Agendador falhou com HTTP $status."
          cat /tmp/scheduler-response.txt || true
          exit 1
